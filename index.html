<main id="home"><span class="tag">YOUR CONNECTIONS, YOUR WAY</span><h2>何を整理しよう？</h2><p style="color:#647870;line-height:1.8">サンプルを書き換えて始められます。<br>位置も、順序も、つながりも、あとから自由に。</p><div id="templates"></div><h3 style="margin-top:32px">マイマップ</h3><div id="maps"></div><p><small>この端末のブラウザに自動保存。大切な記録は「保存書出」でバックアップしてください。</small></p></main>

<dialog id="nodeDialog"><h3>項目を編集</h3><label>名前</label><input id="titleInput"><label>種類</label><select id="kind"><option>項目</option><option>章</option><option>人物</option><option>出来事</option><option>財産</option><option>組織</option><option>技能</option><option>疑問</option></select><label>メモ</label><textarea id="note"></textarea><label>URL</label><input id="url" type="url" placeholder="https://"><button id="openUrl" style="margin-top:6px">登録したURLを開く</button><label>日付（時系列で使う・任意）</label><input id="date" type="date"><label>色</label><input id="color" type="color"><label>写真・画像</label><input id="photo" type="file" accept="image/*"><img id="photoPreview"><button id="removePhoto">画像を外す</button><div class="actions"><button id="deleteNode">削除</button><button onclick="nodeDialog.close()">取消</button><button id="saveNode" class="primary">保存</button></div></dialog>
<dialog id="edgeDialog"><h3>つながりを編集</h3><label>接続元</label><select id="from"></select><label>接続先</label><select id="to"></select><label>関係名（任意）</label><input id="relation" placeholder="所属・親子・原因など"><label><input id="direction" type="checkbox" style="width:auto"> 方向を矢印で表示</label><div class="actions"><button id="deleteEdge">線を外す</button><button onclick="edgeDialog.close()">取消</button><button id="saveEdge" class="primary">保存</button></div></dialog>
<dialog id="searchDialog"><h3>必要な情報を探す</h3><input id="query" placeholder="名前・メモ・種類を検索"><div id="results"></div><div class="actions"><button onclick="searchDialog.close()">閉じる</button></div></dialog><script>
const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID(), clone=x=>JSON.parse(JSON.stringify(x));
let db;try{db=JSON.parse(localStorage.getItem('my-academia-v1'))||{maps:[]}}catch{db={maps:[]}}let map=null,selected=null,history=[],future=[],view={x:0,y:0,s:1},linkStart=null,nodeEdit=null,edgeEdit=null,photoData='',timeline=false;
const presets=[['構造・仕組み','全体と要素、その役割を記録','全体','構成要素A','構成要素B','役割'],['人間関係','人物と関係を、自分の言葉で','自分','家族','友人','仕事仲間'],['時系列','出来事と日付、前後の流れ','テーマ','最初の出来事','次の出来事','転機'],['相続情報','家族・財産・書類・手続き','相続情報','家族','財産','手続き'],['学歴・職歴','経験と技能、人生の転機','自分の経歴','学校','会社','身につけた技能'],['自由に作る','白紙から、自由につなぐ','中心の考え']];
function persist(){try{localStorage.setItem('my-academia-v1',JSON.stringify(db));$('status').textContent='端末に保存済み'}catch{$('status').textContent='保存失敗：保存書出で退避してください';alert('端末への保存に失敗しました。保存書出でバックアップしてください。')}}

function commit(){map.updated=Date.now();persist();draw()}
function home(){hideRead();map=null;syncBackupLabels();$('home').style.display='block';$('editor').style.display='none';$('back').hidden=true;$('status').textContent='自分の考えを、自分の配置で。';$('maps').replaceChildren();db.maps.forEach(m=>{let d=document.createElement('div');d.className='mapcard';let b=document.createElement('button');b.textContent=m.name+'　'+m.nodes.length+'項目';b.onclick=()=>openMap(m);let del=document.createElement('button');del.textContent='削除';del.onclick=()=>{if(confirm('このマップを削除しますか？バックアップは保存書出から作れます。')){db.maps=db.maps.filter(x=>x.id!==m.id);persist();home()}};d.append(b,del);$('maps').append(d)})}
presets.forEach((p,i)=>{let b=document.createElement('button');b.className='card';let title=document.createElement('b');title.textContent=p[0];let desc=document.createElement('p');desc.textContent=p[1];b.append(title,desc);b.onclick=()=>{let name=prompt('マップの名前',p[0]);if(!name)return;let ns=p.slice(2).map((t,j)=>({id:uid(),title:t,note:j===0?'名前や内容を編集して、自分の記録に変えてください。':'',kind:'項目',url:'',date:'',color:j===0?'#d1ede2':'#ffffff',x:[0,-190,190,0][j],y:[0,150,150,300][j]}));let m={id:uid(),name,nodes:ns,edges:ns.slice(1).map(n=>({id:uid(),from:ns[0].id,to:n.id,label:'',directed:false})),updated:Date.now()};db.maps.push(m);persist();openMap(m)};$('templates').append(b)});
function openMap(m){hideRead();chapterView={mode:"full",chapterId:null};map=m;syncBackupLabels();selected=null;history=[];future=[];linkStart=null;timeline=false;$('home').style.display='none';$('editor').style.display='block';$('back').hidden=false;$('timeline').style.display='none';$('canvas').style.display='block';$('hint').style.display='block';$('time').textContent='時系列';$('status').textContent='端末に保存済み';requestAnimationFrame(fit)}
function svg(tag,attrs={},txt){let e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(let k in attrs)e.setAttribute(k,attrs[k]);if(txt!==undefined)e.textContent=txt;return e}
function draw(){if(!map)return;syncChapterControls();const display=getChapterDisplay(map);let w=$('world');w.replaceChildren();w.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.s})`);display.edges.forEach(e=>{let a=display.nodes.find(n=>n.id===e.from),b=display.nodes.find(n=>n.id===e.to);if(!a||!b)return;let g=svg('g',{class:'edge'}),attrs={x1:a.x,y1:a.y,x2:b.x,y2:b.y};g.append(svg('line',{...attrs,class:'hit'}),svg('line',{...attrs,stroke:'#8aa89c','stroke-width':2,...(e.directed?{'marker-end':'url(#arrow)'}:{})}));if(e.label){let t=svg('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-9,'text-anchor':'middle',fill:'#486b5f','font-size':12,'paint-order':'stroke',stroke:'#f4f6f4','stroke-width':5},e.label);g.append(t)}g.onclick=()=>{if(!e.overviewOnly)editEdge(e)};w.append(g)});display.nodes.forEach(n=>{let g=svg('g',{class:'node'+(selected===n.id?' selected':''),transform:`translate(${n.x} ${n.y})`,'data-id':n.id});g.append(svg('rect',{x:-76,y:-25,width:152,height:50,rx:12,fill:n.color||'#fff'}));g.append(svg('text',{'text-anchor':'middle',y:n.photo?-1:5,'font-size':14,fill:'#263e43'},n.title.length>11?n.title.slice(0,11)+'…':n.title));if(n.note||n.url||n.date||n.photo)g.append(svg('text',{'text-anchor':'middle',y:19,'font-size':9,fill:'#62786e'},[n.note?'メモ':'',n.url?'URL':'',n.date,n.photo?'画像':''].filter(Boolean).join(' · ')));g.ondblclick=()=>editNode(map.nodes.find(item=>item.id===n.id));w.append(g)});$('undo').disabled=!history.length;$('redo').disabled=!future.length;if(timeline)renderTimeline();refreshRead()}
function fit(){let c=$('canvas');let ns=getChapterDisplay(map).nodes;if(!ns.length){view={x:c.clientWidth/2,y:c.clientHeight/2,s:1};draw();return}let xs=ns.map(n=>n.x),ys=ns.map(n=>n.y),minX=Math.min(...xs)-100,maxX=Math.max(...xs)+100,minY=Math.min(...ys)-70,maxY=Math.max(...ys)+70;let s=Math.min(1.2,(c.clientWidth-30)/(maxX-minX),(c.clientHeight-80)/(maxY-minY));view={s,x:c.clientWidth/2-(minX+maxX)/2*s,y:c.clientHeight/2-(minY+maxY)/2*s};draw()}
function editNode(n){nodeEdit=n.id;photoData=n.photo||'';for(let [id,key] of [['titleInput','title'],['kind','kind'],['note','note'],['url','url'],['date','date'],['color','color']])$(id).value=n[key]|| (key==='color'?'#ffffff':'');$('photo').value='';$('photoPreview').src=photoData;$('photoPreview').hidden=!photoData;$('nodeDialog').showModal()}
$('saveNode').onclick=()=>{if(!$('titleInput').value.trim())return;checkpoint();let n=map.nodes.find(n=>n.id===nodeEdit);for(let [id,key] of [['titleInput','title'],['kind','kind'],['note','note'],['url','url'],['date','date'],['color','color']])n[key]=$(id).value;n.photo=photoData;$('nodeDialog').close();commit()};$('removePhoto').onclick=()=>{photoData='';$('photoPreview').hidden=true};$('photo').onchange=async()=>{let f=$('photo').files[0];if(!f)return;let bmp=await createImageBitmap(f);let c=document.createElement('canvas'),s=Math.min(1,900/Math.max(bmp.width,bmp.height));c.width=bmp.width*s;c.height=bmp.height*s;c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.8);$('photoPreview').src=photoData;$('photoPreview').hidden=false};$('openUrl').onclick=()=>{try{let u=new URL($('url').value);if(['https:','http:'].includes(u.protocol))window.open(u.href,'_blank','noopener')}catch{alert('https:// から始まるURLを入力してください')}};
$('deleteNode').onclick=()=>{if(!confirm('項目と添付情報を削除しますか？取り消しで戻せます。'))return;checkpoint();map.nodes=map.nodes.filter(n=>n.id!==nodeEdit);map.edges=map.edges.filter(e=>e.from!==nodeEdit&&e.to!==nodeEdit);selected=null;$('nodeDialog').close();commit()};

$('add').onclick=()=>{if(chapterView.mode==='chapters')setChapterView('full');if(chapterView.mode==='chapter'&&!selected)selected=chapterView.chapterId;let title=prompt('新しい項目の名前');if(!title?.trim())return;checkpoint();let parent=map.nodes.find(n=>n.id===selected),n={id:uid(),title:title.trim(),note:'',kind:'項目',url:'',date:'',color:'#ffffff',x:parent?parent.x+190:($('canvas').clientWidth/2-view.x)/view.s,y:parent?parent.y+120:($('canvas').clientHeight/2-view.y)/view.s};map.nodes.push(n);if(parent)map.edges.push({id:uid(),from:parent.id,to:n.id,label:'',directed:false});selected=n.id;commit()};$('edit').onclick=()=>{let n=map.nodes.find(n=>n.id===selected);if(n)editNode(n);else alert('編集する項目をタップしてください')};$('connect').onclick=()=>{if(map.nodes.length<2)return alert('項目を2つ以上作ってください');editEdge(null)};
function replaceSnapshot(s){let idx=db.maps.findIndex(m=>m.id===map.id);map=s;db.maps[idx]=map;selected=null;persist();draw()}
$('undo').onclick=()=>{if(history.length){future.push(clone(map));replaceSnapshot(history.pop())}};$('redo').onclick=()=>{if(future.length){history.push(clone(map));replaceSnapshot(future.pop())}};
let pointers=new Map(),drag=null,pinch=null;

function planBackupImport(incoming,choices,existing){

  const index=Number(mode.slice(8));
  if(!existing[index])throw Error('置き換え先が見つかりません。');
  if(targets.has(index))throw Error('同じマップに複数の置き換えは指定できません。');

}

<script>
/* つながりノート AI質問画像共有アドオン v1.0
   index.html の既存コードは変更せず、末尾で読み込む。 */
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const button = document.createElement('button');
  button.id = 'askAIImage';
  button.type = 'button';
  button.textContent = '📸 AIに質問';
  button.style.cssText = 'background:#195c78;color:white;border-color:#195c78;flex:1;font-weight:700';
  const tools = $('readTools');
  if (!tools) return;
  tools.style.flexWrap = 'wrap';
  tools.appendChild(button);

  const wrap = (ctx, text, maxWidth) => {
    const out = [];
    for (const para of String(text || '').split(/\r?\n/)) {
      if (!para) { out.push(''); continue; }
      let line = '';
      for (const ch of Array.from(para)) {
        if (ctx.measureText(line + ch).width > maxWidth && line) {
          out.push(line); line = ch;
        } else line += ch;
      }
      out.push(line);
    }
    return out;
  };
  const image = src => new Promise(resolve => {
    if (!src || !/^data:image\//.test(src)) return resolve(null);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
  const pngBlob = canvas => new Promise((resolve, reject) =>
    canvas.toBlob(b => b ? resolve(b) : reject(new Error('画像生成に失敗しました')), 'image/png')
  );
  const saveFile = (file) => {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  };
  const safeName = s => String(s || '項目').replace(/[\\/:*?"<>|]/g, '_').slice(0, 45);
  const makeCard = async (node, currentMap) => {
    const related = (currentMap.edges || []).filter(e => e.from === node.id || e.to === node.id)
      .map(e => {
        const otherId = e.from === node.id ? e.to : e.from;
        const other = currentMap.nodes.find(n => n.id === otherId);
        return other ? `・${other.title}${e.label ? '（' + e.label + '）' : ''}` : null;
      }).filter(Boolean).slice(0, 12);
    const W = 900, pad = 62, textW = W - pad * 2;
    const cv = document.createElement('canvas');
    const ctx = cv.getContext('2d');
    const blocks = [];
    const add = (text, size, color, weight = '400', gap = 8) => {
      ctx.font = `${weight} ${size}px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif`;
      const lines = wrap(ctx, text, textW);
      blocks.push({lines, size, color, weight, gap});
    };
    add('つながりノート  /  AI学習カード', 22, '#4c7387', '600', 30);
    add('マップ：' + currentMap.name, 25, '#355c70', '600', 22);
    add(node.title, 39, '#142e42', '700', 22);
    if (node.kind || node.date) add([node.kind, node.date].filter(Boolean).join('  ·  '), 21, '#557385', '400', 26);
    add('【メモ】', 26, '#17647a', '700', 12);
    add(node.note || 'メモはまだありません。', 25, '#243f4e', '400', 24);
    if (related.length) {
      add('【関連項目】', 26, '#17647a', '700', 12);
      add(related.join('\n'), 23, '#243f4e', '400', 22);
    }
    if (node.url) {
      add('【参考URL】', 26, '#17647a', '700', 10);
      add(node.url, 20, '#315f8c', '400', 18);
    }
    const pic = await image(node.photo);
    let picH = 0;
    if (pic) picH = Math.min(440, Math.round(pic.height * Math.min(textW / pic.width, 440 / pic.height)));
    const textH = blocks.reduce((h, b) => h + b.lines.length * (b.size * 1.55) + b.gap, 0);
    cv.width = W; cv.height = Math.ceil(52 + textH + (pic ? picH + 38 : 0) + 85);
    ctx.fillStyle = '#f4f8fb'; ctx.fillRect(0, 0, W, cv.height);
    ctx.fillStyle = '#dcecf3'; ctx.fillRect(0, 0, W, 15);
    let y = 62;
    for (const b of blocks) {
      ctx.font = `${b.weight} ${b.size}px -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif`;
      ctx.fillStyle = b.color; ctx.textBaseline = 'top';
      for (const line of b.lines) { ctx.fillText(line, pad, y); y += b.size * 1.55; }
      y += b.gap;
    }
    if (pic) {
      y += 5;
      const drawW = Math.round(pic.width * picH / pic.height);
      ctx.drawImage(pic, pad, y, drawW, picH);
      y += picH + 25;
    }
    ctx.fillStyle = '#5b7b8a'; ctx.font = '19px -apple-system, sans-serif';
    ctx.fillText('この内容について、わかりやすく説明してください。', pad, cv.height - 53);
    return cv;
  };
  button.addEventListener('click', async () => {
    if (button.disabled) return;
    const currentMap = typeof map !== 'undefined' ? map : null;
    const currentId = typeof readId !== 'undefined' ? readId : null;
    const node = currentMap?.nodes?.find(n => n.id === currentId);
    if (!node) { alert('質問したい項目を選んでください。'); return; }
    button.disabled = true;
    button.textContent = '画像を作成中…';
    try {
      const card = await makeCard(node, currentMap);
      const blob = await pngBlob(card);
      const file = new File([blob], `つながりノート_${safeName(node.title)}.png`, { type: 'image/png' });
      if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
        try {
          await navigator.share({ files: [file], title: `学習メモ：${node.title}` });
          return;
        } catch (e) {
          if (e.name === 'AbortError') return;
          // 共有できなかった場合は画像保存へフォールバック
        }
      }
      saveFile(file);
      alert('質問用画像を保存しました。ChatGPTで画像を添付して質問してください。');
    } catch (e) {
      alert('画像を作成できませんでした：' + e.message);
    } finally {
      button.disabled = false;
      button.textContent = '📸 AIに質問';
    }
  });
})();

  const share=mk('📤 TXTを共有'), copy=mk('📋 文章をコピー'), save=mk('⬇ TXTを保存'), open=mk('📋 コピーしてChatGPTアプリへ',true), close=mk('閉じる');
  actions.append(share,copy,save,open,close);
  dlg.append(heading,info,lab,sel,qlab,qbox,plab,preview,status,actions);
  document.body.appendChild(dlg);

  let ctx=null, automatic=false;
  const prompts={
    easy:'この項目について、初めて学ぶ人にもわかるように、順序立てて説明してください。難しい言葉はかみくだいてください。',
    why:'この項目はなぜそうなるのですか？原因・仕組み・結果を区別して説明してください。',
    example:'この項目を、身近な生活の例や具体例を使って説明してください。',

  const build=()=>{
    if(!ctx)return '';
    const {m,n}=ctx;
    const related=(m.edges||[]).filter(e=>e.from===n.id||e.to===n.id).map(e=>{
      const id=e.from===n.id?e.to:e.from;
      const other=m.nodes.find(v=>v.id===id);

  const update=()=>{if(!automatic)preview.value=build()};

    const m=typeof map!=='undefined'?map:null;
    const n=m?.nodes?.find(x=>x.id===readId);

    dlg.showModal();
  };
  sel.onchange=()=>{qbox.value=prompts[sel.value];automatic=false;update()};
  qbox.oninput=()=>{automatic=false;update()};

  const file=()=>new File([new Blob([preview.value],{type:'text/plain;charset=utf-8'})], 'つながりノート_質問.txt',{type:'text/plain'});

    catch(e){if(e.name!=='AbortError')status.textContent='共有できませんでした。「文章をコピー」を使ってください。'}
  };

  // chatgpt:// は端末・アプリ版によって動かない場合があるため、手動で開く案内も残す。
  open.onclick=async()=>{

      // ブラウザへは移動しない。iOSがカスタムURLスキームを処理できればアプリが開く。
      window.location.href='chatgpt://';
    }
  };
  close.onclick=()=>dlg.close();

<script>
/* Chapter scopes are projections. This module never writes positions or edges. */
let chapterView={mode:'full',chapterId:null};
function chapterStructure(source){
 const nodes=new Map(source.nodes.map(n=>[n.id,n])),out=new Map(),incoming=new Set();
 source.edges.forEach(e=>{if(nodes.has(e.from)&&nodes.has(e.to)&&e.from!==e.to){if(!out.has(e.from))out.set(e.from,[]);out.get(e.from).push(e.to);incoming.add(e.to);}});
 const roots=source.nodes.filter(n=>!incoming.has(n.id));
 const root=roots[0]||source.nodes[0];
 let chapters=source.nodes.filter(n=>n.kind==='章');
 // Explicit chapter markers win; older maps can use numbered chapter titles.
 if(!chapters.length)chapters=source.nodes.filter(n=>/^(?:★|☆|\s)*(?:第[0-9０-９一二三四五六七八九十百]+章|[0-9０-９]{1,3}[ .．、　])/.test(n.title||''));
 if(!chapters.length&&root)chapters=(out.get(root.id)||[]).map(id=>nodes.get(id));
 chapters=chapters.slice().sort((a,b)=>(a.y-b.y)||(a.x-b.x));
 const chapterSet=new Set(chapters.map(n=>n.id)),rootSet=new Set(roots.map(n=>n.id));
 if(root&&!chapterSet.has(root.id))rootSet.add(root.id);
 // A shared item may belong to several chapters. Another chapter and a map root
 // are boundaries, so a cross-reference cannot pull the other chapter into view.
 function descendants(id){const seen=new Set(),queue=[id];for(let i=0;i<queue.length;i++){const next=queue[i];if(seen.has(next))continue;seen.add(next);for(const child of out.get(next)||[]){if(child===id||(!chapterSet.has(child)&&!rootSet.has(child)))queue.push(child);}}return seen;}
 return {nodes,out,roots,root,chapters,chapterSet,descendants};
}
function chapterIds(source){return chapterStructure(source).chapters.map(n=>n.id);}
function getChapterDisplay(source,state=chapterView){
 if(state.mode==='full')return source;
 const info=chapterStructure(source);
 if(state.mode==='chapter'){
  if(!info.chapterSet.has(state.chapterId))return source;
  const ids=info.descendants(state.chapterId);
  return {...source,name:source.name+'｜'+info.nodes.get(state.chapterId).title,nodes:source.nodes.filter(n=>ids.has(n.id)),edges:source.edges.filter(e=>ids.has(e.from)&&ids.has(e.to))};
 }
 if(!info.chapters.length)return {...source,nodes:[],edges:[]};
 // Compact overview: display coordinates only. Original coordinates are untouched.
 const roots=info.roots.filter(n=>!info.chapterSet.has(n.id));
 if(!roots.length&&info.root&&!info.chapterSet.has(info.root.id))roots.push(info.root);

}

@media(max-width:550px){header{gap:6px}header button{white-space:nowrap;font-size:11px;padding:8px}header h1{font-size:12px;white-space:nowrap;gap:6px}header h1:before{width:22px;height:22px}header .spacer{min-width:0}#chapterBar{gap:5px;padding:7px}#chapterBar label{display:none}#chapterBar select{max-width:44vw}#chapterHelp{display:none}}`;

 if(chapterView.chapterId)$('chapterChoice').value=chapterView.chapterId;
 $('chapterBack').hidden=chapterView.mode!=='chapter';
 $('chapterHelp').textContent=info.chapters.length?(chapterView.mode==='chapters'?'章をタップして開く':''):'編集の「種類」を「章」にすると章として表示できます';
 $('hint').textContent=chapterView.mode==='chapters'?'章をタップして中の項目へ／背景で移動・ピンチで拡大':'タップで内容を見る・ドラッグで移動／背景を動かして移動';
}
function setChapterView(mode,chapterId=null){
 if(!map)return;
 chapterView={mode,chapterId:mode==='chapter'?(chapterId||chapterIds(map)[0]||null):null};
 selected=null;hideRead();if(timeline)$('time').click();syncChapterControls();fit();
}
$('chapterMode').onchange=()=>setChapterView($('chapterMode').value);
$('chapterChoice').onchange=()=>setChapterView('chapter',$('chapterChoice').value);
$('chapterBack').onclick=()=>setChapterView('chapters');
// Preserve custom imported kinds when opening the existing editor.
const chapterEditNode=editNode;
editNode=function(n){if(![...$('kind').options].some(o=>o.value===n.kind)&&n.kind){const o=document.createElement('option');o.textContent=n.kind;$('kind').append(o);}chapterEditNode(n);};
function chapterPrintSVG(snapshot){
 const canvas=svg('svg',{xmlns:'http://www.w3.org/2000/svg'}),defs=svg('defs');
 const marker=svg('marker',{id:'arrow',markerWidth:8,markerHeight:8,refX:7,refY:4,orient:'auto'});marker.append(svg('path',{d:'M0,0 L8,4 L0,8',fill:'#648b80'}));defs.append(marker);canvas.append(defs);
 const lookup=new Map(snapshot.nodes.map(n=>[n.id,n]));
 snapshot.edges.forEach(e=>{const a=lookup.get(e.from),b=lookup.get(e.to);if(!a||!b)return;canvas.append(svg('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'#8aa89c','stroke-width':2,...(e.directed?{'marker-end':'url(#arrow)'}:{})}));if(e.label)canvas.append(svg('text',{x:(a.x+b.x)/2,y:(a.y+b.y)/2-9,'text-anchor':'middle','font-size':12,fill:'#486b5f'},e.label));});
 snapshot.nodes.forEach(n=>{const g=svg('g',{class:'node',transform:`translate(${n.x} ${n.y})`,'data-id':n.id});g.append(svg('rect',{x:-76,y:-25,width:152,height:50,rx:12,fill:n.color||'#fff'}));canvas.append(g);});return canvas;
}
// The same scope selector controls both A3 maps and A4 notes.
const pdfScopeLabel=document.createElement('label');pdfScopeLabel.textContent='出力する範囲';pdfScopeLabel.htmlFor='chapterPdfScope';
const pdfScope=document.createElement('select');pdfScope.id='chapterPdfScope';
a3Info.after(pdfScopeLabel,pdfScope);
let chapterPdfSource=null;
function applyChapterPdfScope(){
 const value=pdfScope.value;
 const state=value==='full'||value==='chapters'?{mode:value,chapterId:null}:{mode:'chapter',chapterId:value.slice(8)};
 a3Snapshot=clone(getChapterDisplay(chapterPdfSource,state));updateA3Info();
}
pdfScope.onchange=applyChapterPdfScope;
$('print').onclick=()=>{
 if(!map)return;chapterPdfSource=clone(map);pdfScope.replaceChildren();
 const add=(value,text)=>{const o=document.createElement('option');o.value=value;o.textContent=text;pdfScope.append(o);};
 add('full','全項目（全体マップ）');add('chapters','章まで（全体構成）');
 chapterStructure(chapterPdfSource).chapters.forEach(n=>add('chapter:'+n.id,'章：'+n.title));
 pdfScope.options[1].disabled=!chapterIds(map).length;
 pdfScope.value=chapterView.mode==='chapter'?'chapter:'+chapterView.chapterId:chapterView.mode;
 a3Select.value='auto';a3Info.textContent='全項目・章まで・各章を選んで出力できます。マップはA3、文章はA4。向きは自動または手動で選べます。保存データや配置は変わりません。';applyChapterPdfScope();a3Dialog.showModal();
};
updateA3Info=function(){
 if(!a3Snapshot)return;
 const b=printMapBounds(a3Snapshot.nodes),p=a3Tiles(b,'portrait'),l=a3Tiles(b,'landscape'),chosen=selectedA3();
 const pages=layout=>layout.tiles.length===1?1:1+layout.tiles.length;
 a3Count.textContent=a3Snapshot.nodes.length+'項目。A3縦 '+pages(p)+'ページ／A3横 '+pages(l)+'ページ。選択：'+(chosen.orientation==='portrait'?'縦':'横')+' '+pages(chosen)+'ページ（'+(chosen.tiles.length===1?'全体図のみ':'全体図＋拡大図')+'）。';
};
a3Select.onchange=()=>updateA3Info();

</script>
